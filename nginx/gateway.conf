server {
    listen 80;
    server_name localhost;

    # Docker puede cambiar la IP de un servicio al recrear su contenedor.
    # Resolver en cada consulta evita que Nginx conserve una IP antigua.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mercure_upstream http://mercure;
    set $auth_upstream http://auth:80;
    set $core_upstream http://core:80;
    set $frontend_upstream http://frontend:80;

    # 1. Mercure (Server-Sent Events)
    location /.well-known/mercure {
        proxy_pass $mercure_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Modo subscriber anónimo: evita que cookies o headers viejos disparen 401 en Mercure.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Vital para SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # 2. Auth API
    location ^~ /api/auth/ {
        rewrite ^/api/auth/(.*)$ /auth/$1 break;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Core API
    location ^~ /api/core/ {
        rewrite ^/api/core/(.*)$ /$1 break;
        proxy_pass $core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Frontend
    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
