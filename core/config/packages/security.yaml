security:
    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER]

    providers:
        core_user_provider:
            id: App\Infrastructure\Security\CoreUserProvider
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # 🔹 Firewall principal para rutas con sesión
        main:
            lazy: true
            stateless: false   # permite manejar sesión Symfony
            entry_point: null
            provider: core_user_provider
            logout:
                path: /logout
                invalidate_session: true
                clear_site_data: true

        # 🔹 Firewall API: token validado manualmente
        api:
            pattern: ^/api
            stateless: true    # no usamos sesión
            security: false    # todo se valida manualmente en controlador
    
    access_control:
        - { path: ^/productos, methods: [POST, PUT, DELETE], roles: ROLE_ADMIN }
        - { path: ^/productos, roles: PUBLIC_ACCESS }
        - { path: ^/usuarios, roles: ROLE_USER }
